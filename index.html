    <!--
      After you deploy, add these two tags with your real absolute URLs:
        <link rel="canonical" href="https://YOUR-DOMAIN/" />
        <meta property="og:url" content="https://YOUR-DOMAIN/" />
        <meta property="og:image" content="https://YOUR-DOMAIN/og-image.png" />  (1200x630 image in /public)
      They are left out on purpose so no placeholder URL ships to production.
    -->

    <!-- Open Graph -->

    <!-- Icons -->

    <!-- Fonts: Bricolage Grotesque (headings) + Instrument Sans (body). System fonts are the fallback. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400;500;600;700&display=swap"
    />

    <!-- Apply the saved theme before first paint (default: dark) so there is no flash. -->
    <script>
      (function () {
        var theme = 'dark';
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'light' ? '#F3F5F9' : '#0E1524');
      })();
    </script>
